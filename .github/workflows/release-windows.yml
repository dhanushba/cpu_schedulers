name: Release Windows Portable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          arch: "win64_msvc2019_64"

      - name: Show Qt tools
        shell: pwsh
        run: |
          python -m aqt list-qt windows desktop --arch 6.7.2
          where qmake
          where windeployqt

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Create portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/CPUScheduler-portable | Out-Null
          if (!(Test-Path "build/Release/CPUScheduler.exe")) { throw "Release executable not found at build/Release/CPUScheduler.exe" }
          Copy-Item build/Release/CPUScheduler.exe dist/CPUScheduler-portable/
          windeployqt --release --compiler-runtime --no-translations dist/CPUScheduler-portable/CPUScheduler.exe
          Compress-Archive -Path dist/CPUScheduler-portable/* -DestinationPath dist/CPUScheduler-portable-win64-msvc.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPUScheduler-portable-win64-msvc
          path: dist/CPUScheduler-portable-win64-msvc.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CPUScheduler-portable-win64-msvc.zip
          generate_release_notes: true
